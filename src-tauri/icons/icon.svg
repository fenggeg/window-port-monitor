<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f36"/>
      <stop offset="100%" style="stop-color:#0f1225"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="none" stroke="#58a6ff" stroke-width="2" stroke-opacity="0.15"/>

  <!-- Glow effect behind the icon -->
  <ellipse cx="256" cy="240" rx="120" ry="100" fill="url(#glow)"/>

  <!-- Network port symbol - central hub -->
  <circle cx="256" cy="220" r="28" fill="url(#accent)" opacity="0.9"/>

  <!-- Port dots - 6 connection points around the hub -->
  <!-- Top -->
  <circle cx="256" cy="140" r="14" fill="url(#accent)" opacity="0.8"/>
  <line x1="256" y1="168" x2="256" y2="192" stroke="#58a6ff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- Top-right -->
  <circle cx="325" cy="165" r="14" fill="url(#accent)" opacity="0.8"/>
  <line x1="304" y1="183" x2="279" y2="201" stroke="#58a6ff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- Bottom-right -->
  <circle cx="325" cy="275" r="14" fill="url(#accent)" opacity="0.8"/>
  <line x1="304" y1="257" x2="279" y2="239" stroke="#58a6ff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- Bottom -->
  <circle cx="256" cy="300" r="14" fill="url(#accent)" opacity="0.8"/>
  <line x1="256" y1="272" x2="256" y2="248" stroke="#58a6ff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- Bottom-left -->
  <circle cx="187" cy="275" r="14" fill="url(#accent)" opacity="0.8"/>
  <line x1="208" y1="257" x2="233" y2="239" stroke="#58a6ff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- Top-left -->
  <circle cx="187" cy="165" r="14" fill="url(#accent)" opacity="0.8"/>
  <line x1="208" y1="183" x2="233" y2="201" stroke="#58a6ff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- Pulse rings on active connections -->
  <circle cx="325" cy="165" r="20" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0.3"/>
  <circle cx="187" cy="275" r="20" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0.3"/>

  <!-- Data flow particles -->
  <circle cx="280" cy="185" r="4" fill="#58a6ff" opacity="0.7"/>
  <circle cx="230" cy="260" r="4" fill="#58a6ff" opacity="0.7"/>

  <!-- Bottom text bar area -->
  <rect x="100" y="360" width="312" height="4" rx="2" fill="#58a6ff" opacity="0.2"/>

  <!-- Port number text -->
  <text x="256" y="410" font-family="monospace" font-size="52" font-weight="bold" fill="#58a6ff" text-anchor="middle" opacity="0.85">:8080</text>

  <!-- Small status dots at bottom -->
  <circle cx="200" cy="445" r="6" fill="#3fb950"/>
  <circle cx="228" cy="445" r="6" fill="#58a6ff"/>
  <circle cx="256" cy="445" r="6" fill="#d29922"/>
  <circle cx="284" cy="445" r="6" fill="#a371f7"/>
  <circle cx="312" cy="445" r="6" fill="#f85149"/>
</svg>
